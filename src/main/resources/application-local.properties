# Local development settings; .env must contain simple KEY=VALUE entries.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:boxing_academy}
spring.datasource.username=${POSTGRES_USER:boxing_academy}
spring.datasource.password=${POSTGRES_PASSWORD}
server.address=127.0.0.1
